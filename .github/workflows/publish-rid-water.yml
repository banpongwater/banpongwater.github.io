name: Refresh Ban Pong RID data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ban-pong-rid-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Fetch latest Ban Pong RID telemetry
        run: node fetch-rid-data.mjs
        continue-on-error: true

      - name: Publish changed water snapshot
        run: |
          if git diff --quiet -- water-data.json; then
            echo "No new Ban Pong data; keeping the existing snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add water-data.json
          git commit -m "Refresh Ban Pong RID water data"
          git push origin HEAD:main
